[project]
name = "newsline"
version = "0.0.1"
description = "A personal news radar that tracks storylines, learns your taste, runs locally."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "newsline contributors" }]

dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "pydantic>=2.6",
    "rich>=13.7",
    "click>=8.1",
    "python-dotenv>=1.0",
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
newsline = "newsline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newsline"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
